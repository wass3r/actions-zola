name: Test Action

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-version-validation:
    name: Test version validation
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        version:
          - v0.20.0 # Minimum supported
          - v0.23.3 # Default
          - v0.19.0 # Should fail
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test with ${{ matrix.version }}
        id: test
        continue-on-error: true
        uses: ./
        with:
          zola_version: ${{ matrix.version }}
          root: test-site

      - name: Verify v0.19.0 failed
        if: matrix.version == 'v0.19.0'
        run: |
          if [ "${{ steps.test.outcome }}" != "failure" ]; then
            echo "::error::Expected v0.19.0 to fail version check"
            exit 1
          fi
          echo "✅ v0.19.0 correctly rejected"

      - name: Verify supported versions succeeded
        if: matrix.version != 'v0.19.0'
        run: |
          if [ "${{ steps.test.outcome }}" != "success" ]; then
            echo "::error::Expected ${{ matrix.version }} to succeed"
            exit 1
          fi
          echo "✅ ${{ matrix.version }} worked correctly"

  test-platforms:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        zola_version: [v0.20.0, v0.23.3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build test site
        uses: ./
        with:
          zola_version: ${{ matrix.zola_version }}
          root: test-site

      - name: Verify output exists
        shell: bash
        run: |
          if [ ! -d "test-site/public" ]; then
            echo "::error::Expected public/ directory not found"
            exit 1
          fi
          if [ ! -f "test-site/public/index.html" ]; then
            echo "::error::Expected index.html not found"
            exit 1
          fi
          echo "✅ Build output verified"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: site-${{ matrix.os }}-${{ matrix.zola_version }}
          path: test-site/public/

  test-options:
    name: Test build options
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test with custom base_url
        uses: ./
        with:
          root: test-site
          base_url: https://example.com

      - name: Test with custom output_dir
        uses: ./
        with:
          root: test-site
          output_dir: test-site/dist

      - name: Verify custom output directory
        run: |
          if [ ! -d "test-site/dist" ]; then
            echo "::error::Custom output directory not found"
            exit 1
          fi
          echo "✅ Custom output_dir worked"

      - name: Test with drafts enabled
        uses: ./
        with:
          root: test-site
          drafts: true

      - name: Test with check_links enabled
        uses: ./
        with:
          root: test-site
          check_links: true

      - name: Test with check_links_skip_external enabled
        uses: ./
        with:
          root: test-site
          check_links: true
          check_links_skip_external: true

      - name: Test with cache disabled
        uses: ./
        with:
          root: test-site
          use_cache: false

  test-caching:
    name: Test binary caching (first run)
    runs-on: ubuntu-latest

    permissions:
      actions: write

    env:
      ZOLA_VERSION: v0.23.3

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Delete existing cache if present
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZOLA_VERSION: ${{ env.ZOLA_VERSION }}
        run: |
          # Detect platform for cache key
          case "$RUNNER_OS" in
            Linux)
              TARGET="x86_64-unknown-linux-gnu"
              ;;
            macOS)
              if [ "$(uname -m)" = "arm64" ]; then
                TARGET="aarch64-apple-darwin"
              else
                TARGET="x86_64-apple-darwin"
              fi
              ;;
            Windows)
              TARGET="x86_64-pc-windows-msvc"
              ;;
          esac

          # Use default version from action.yml
          CACHE_KEY="zola-${ZOLA_VERSION}-${TARGET}-v3-archive"
          echo "Attempting to delete cache: $CACHE_KEY"

          gh cache delete "$CACHE_KEY" --repo ${{ github.repository }} || echo "Cache not found or already deleted"

      - name: First build (cache miss expected)
        uses: ./
        with:
          root: test-site
          zola_version: ${{ env.ZOLA_VERSION }}

      - name: Verify binary was installed
        run: |
          if [ ! -f "$HOME/.zola/bin/zola" ]; then
            echo "::error::Zola binary not found after first build"
            exit 1
          fi
          echo "✅ Zola binary installed and cached for next job"

  test-caching-hit:
    name: Test binary caching (cache hit)
    runs-on: ubuntu-latest
    needs: test-caching

    env:
      ZOLA_VERSION: v0.23.3

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Second build (cache hit expected)
        uses: ./
        with:
          root: test-site
          zola_version: ${{ env.ZOLA_VERSION }}

      - name: Verify Zola still works after cache
        run: |
          zola --version
          echo "✅ Cached binary works"
